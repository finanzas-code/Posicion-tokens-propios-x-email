name: Keep Alive

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep alive
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git commit --allow-empty -m "chore: keep workflows active"
          git push
